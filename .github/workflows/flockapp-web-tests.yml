
name: FlockApp Docker UI Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  docker-tests:
    name: Dockerised Selenium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TEST_TAGS: ${{ (github.base_ref || github.ref_name) == 'main' && 'not @ignore' || '@smoke' }}

    steps:
      - name: Checkout test automation
        uses: actions/checkout@v4
        with:
          path: FlockApp

      - name: Checkout FlockApp website
        uses: actions/checkout@v4
        with:
          repository: WenZhu72/flock-app-docker
          ref: main
          path: flock-app

      - name: Validate Docker Compose
        working-directory: FlockApp
        run: docker compose config --quiet

      - name: Run Dockerised Selenium tests
        working-directory: FlockApp
        run: |
          docker compose run --build --rm \
            -e TEST_TAGS="$TEST_TAGS" \
            tests mvn -B \
              -Dmaven.test.failure.ignore=true \
              -Dcucumber.filter.tags="$TEST_TAGS" \
              -Dwebdriver.base.url=http://flockapp \
              -Dwebdriver.driver=remote \
              -Dwebdriver.remote.url=http://selenium:4444/wd/hub \
              -Dwebdriver.remote.driver=chrome \
              verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-test-reports
          path: |
            FlockApp/target/site/serenity/
            FlockApp/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up Docker
        if: always()
        working-directory: FlockApp
        run: docker compose down --remove-orphans
