webdriver.driver=chrome
webdriver.autodownload=true

# Timeouts (milliseconds)
webdriver.timeouts.implicitlywait=10000
webdriver.wait.for.timeout=15000

# Each switch is separated by ";". The trailing "\" continues the
# value onto the next line, so this is still a single property.
chrome.switches=--headless;\
                --remote-allow-origins=*;\
                --disable-web-security;\
                --window-size=1920,1080;\
                --no-sandbox;\
                --disable-dev-shm-usage;\
                --incognito

# Disable Chrome password manager / breach warning pop-ups
chrome_preferences.credentials_enable_service=false
chrome_preferences.profile.password_manager_enabled=false
chrome_preferences.profile.password_manager_leak_detection=false

serenity.browser.maximized=true

# Start a fresh browser for every scenario
serenity.restart.browser.for.each=scenario

serenity.take.screenshots=AFTER_EACH_STEP

serenity.project.name=FlockApp Web Tests
serenity.test.root=com.sparta.FlockApp.runners
# Default for running tests from IntelliJ on Windows
webdriver.base.url=http://localhost:8080
